name: vision-parse

services:
  vision-parse:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}  # Optional: For OpenAI models
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - VISION_PARSE_MODEL_NAME=${VISION_PARSE_MODEL_NAME:-gpt-4o} # Default to gpt-4o if not set
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}  # Optional: For Gemini models
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          memory: 2G  # Set memory limit to 2GB
        reservations:
          memory: 1G   # Guarantee at least 1GB
          # Uncomment below lines if you have NVIDIA GPU available
          # devices:
          #   - driver: nvidia
          #     count: all
          #     capabilities: [gpu]
    command: tail -f /dev/null  # Keep container running 
